<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Ciudad - Sistema de Reservas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Hotel Ciudad</h1>
        <p>Formulario de Reservas en Línea</p>
    </header>

    <main>
        <!-- CONTENEDOR PRINCIPAL DE DOS COLUMNAS -->
        <div class="columnas-reserva">

            <!-- COLUMNA 1: Formulario Completo -->
            <form id="form-reservas" novalidate>
                
                <!-- DATOS PERSONALES -->
                <fieldset>
                    <legend>Datos Personales</legend>
                    
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido:</label>
                        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
                        <span class="error-msg" id="error-nombre"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" placeholder="ejemplo@correo.com">
                        <span class="error-msg" id="error-email"></span>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" placeholder="Solo 8 números">
                        <span class="error-msg" id="error-dni"></span>
                    </div>

                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de Nacimiento (Mayor de 18 años):</label>
                        <input type="date" id="fecha_nacimiento">
                        <span class="error-msg" id="error-nacimiento"></span>
                    </div>
                </fieldset>

                <!-- DETALLES DE LA ESTADÍA -->
                <fieldset>
                    <legend>Detalles de la Estadía</legend>

                    <div class="form-group">
                        <label for="habitacion">Tipo de Habitación:</label>
                        <select id="habitacion">
                            <!-- Las opciones se cargarán dinámicamente desde el JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio_noche">Precio por Noche ($):</label>
                        <input type="text" id="precio_noche" readonly>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción de la Habitación:</label>
                        <textarea id="descripcion" readonly rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fecha_ingreso">Fecha de Ingreso:</label>
                        <input type="date" id="fecha_ingreso">
                        <span class="error-msg" id="error-ingreso"></span>
                    </div>

                    <div class="form-group">
                        <label for="fecha_egreso">Fecha de Egreso:</label>
                        <input type="date" id="fecha_egreso">
                        <span class="error-msg" id="error-egreso"></span>
                    </div>

                    <div class="form-group">
                        <label for="huespedes">Cantidad de Huéspedes:</label>
                        <input type="number" id="huespedes" min="1" max="6" placeholder="1 a 6">
                        <span class="error-msg" id="error-huespedes"></span>
                    </div>

                    <div class="form-group">
                        <label for="noches">Cantidad de Noches:</label>
                        <input type="number" id="noches" min="1" placeholder="Mínimo 1 noche">
                        <span class="error-msg" id="error-noches"></span>
                    </div>
                </fieldset>

                <!-- DATOS DE PAGO -->
                <fieldset>
                    <legend>Método de Pago</legend>

                    <div class="form-group">
                        <label for="tarjeta">Número de Tarjeta:</label>
                        <div class="tarjeta-contenedor">
                            <input type="text" id="tarjeta" placeholder="16 dígitos sin espacios" maxlength="16">
                            <img id="logo-tarjeta" class="logo-tarjeta" src="" alt="Logo Tarjeta" style="display: none;">
                        </div>
                        <span class="error-msg" id="error-tarjeta"></span>
                    </div>

                    <div class="form-group">
                        <label for="cvv">CVV:</label>
                        <input type="text" id="cvv" placeholder="3 o 4 dígitos">
                        <span class="error-msg" id="error-cvv"></span>
                    </div>

                    <div class="form-group">
                        <label for="vencimiento_tarjeta">Fecha de Vencimiento (MM/AA):</label>
                        <input type="text" id="vencimiento_tarjeta" placeholder="Ej. 12/28" maxlength="5">
                        <span class="error-msg" id="error-vencimiento"></span>
                    </div>
                </fieldset>

                <!-- ADICIONALES Y TOTAL -->
                <fieldset>
                    <legend>Adicionales y Total</legend>
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="seguro">
                        <label for="seguro">¿Desea incluir Seguro de Viaje Adicional? (+15% sobre el total)</label>
                    </div>

                    <div class="total-container">
                        <h3>Total a Pagar: $<span id="total-pagar">0</span></h3>
                    </div>
                </fieldset>

                <!-- MENSAJES Y SUBMIT DEL FORMULARIO -->
                <div class="submit-container">
                    <p id="error-general" class="error-general-msg"></p>
                    <button type="submit" id="btn-submit" disabled>Confirmar Reserva</button>
                </div>

            </form>

            <!-- COLUMNA 2: El Resumen / Comprobante -->
            <!-- Se mantiene fuera del <form> para que no se envíe y actúe como un widget lateral -->
            <div id="resumen-reserva" class="comprobante-reserva" style="display: none;">
                <!-- Se poblará dinámicamente desde JS -->
            </div>

        </div>
    </main>

    <script src="js/reservas.js" type="module"></script>
</body>
</html>
